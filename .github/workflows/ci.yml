name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag (no "v10"), so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --locked --python ${{ matrix.python }} poe check

  # The UNO integration tests against the oldest supported LibreOffice (see README: 25.8).
  integration:
    runs-on: ubuntu-latest
    env:
      LO_VERSION: "25.8.7"
      LO_SHA256: "7f4d7b2e36921eec5122c655249a24cc88935ee357e8261fd3bccd15aa1f7b9f"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install LibreOffice ${{ env.LO_VERSION }} (extracted, not installed system-wide)
        run: |
          path="libreoffice/stable/${LO_VERSION}/deb/x86_64"
          tgz="LibreOffice_${LO_VERSION}_Linux_x86-64_deb.tar.gz"
          cd "$RUNNER_TEMP"
          # The checksum is pinned here, so any mirror will do; try several in turn.
          for host in https://download.documentfoundation.org https://ftp.fau.de/tdf https://mirror.netcologne.de/tdf https://ftp.gwdg.de/pub/tdf; do
            echo "Downloading $host/$path/$tgz"
            if curl -fsSL --retry 3 --retry-all-errors -o "$tgz" "$host/$path/$tgz" &&
               echo "$LO_SHA256  $tgz" | sha256sum -c -; then
              break
            fi
            rm -f "$tgz"
          done
          test -f "$tgz" || { echo "could not download a verified $tgz"; exit 1; }
          tar xzf "$tgz"
          for deb in LibreOffice_*/DEBS/*.deb; do
            case "$deb" in *kde-integration*|*gnome-integration*) continue ;; esac
            dpkg -x "$deb" lo
          done
          program="$(echo "$RUNNER_TEMP"/lo/opt/libreoffice*/program)"
          echo "LIBREOFFICE_PROGRAM=$program" >> "$GITHUB_ENV"
          "$program/soffice" --version
      - name: Missing shared libraries (diagnostics)
        if: failure()
        run: ldd "$LIBREOFFICE_PROGRAM/soffice.bin" | grep "not found" || true
      - name: Integration tests
        shell: bash
        run: |
          set +e
          uv run --locked poe test-lo 2>&1 | tee "$RUNNER_TEMP/test-lo.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Repeat the first failure and the summary as an annotation on the run summary page.
            msg="$(python3 -c "
          import sys
          log = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          start = log.find('FAIL ')
          first = log[start:start + 3000] if start >= 0 else log[-3000:]
          tail = '\n'.join(l for l in log.splitlines() if l.startswith(('ABORT', 'FAIL ')) or ' passed, ' in l)
          text = first + '\n...\n' + tail
          sys.stdout.write(text.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          " "$RUNNER_TEMP/test-lo.log")"
            echo "::error title=test-lo output::$msg"
          fi
          exit "$status"
