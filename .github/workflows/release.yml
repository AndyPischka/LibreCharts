name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Run exactly what CI runs, including the UNO integration tests, before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --locked poe build
      - name: Write the checksum
        run: sha256sum dist/*.oxt > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: oxt
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: oxt
          path: dist
      - name: Check that the tag matches the package version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - name: Take the release notes from the changelog
        run: |
          python - <<'PY' > notes.md
          import re
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", text, re.M | re.S)
          print(match.group(0).strip() if match else text)
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.oxt dist/SHA256SUMS \
            --title "LibreCharts ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
