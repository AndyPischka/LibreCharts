<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-label="LibreCharts">
  <title>LibreCharts</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3F68"/>
      <stop offset="1" stop-color="#12253F"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- three ascending columns, simplified for small sizes -->
  <rect x="88" y="256" width="96" height="160" rx="8" fill="#C9D8EE"/>
  <rect x="208" y="176" width="96" height="240" rx="8" fill="#8FB4E3"/>
  <rect x="328" y="96" width="96" height="320" rx="8" fill="#F4B183"/>
</svg>
